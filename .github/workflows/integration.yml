name: Integration Tests

on:
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check for API key
        id: key
        env:
          LLMCALL_API_KEY: ${{ secrets.LLMCALL_API_KEY }}
        run: |
          if [ -n "$LLMCALL_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::LLMCALL_API_KEY is not available to this run; skipping live tests."
          fi

      - name: Check out repository
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install tox
        if: steps.key.outputs.present == 'true'
        run: python -m pip install --upgrade pip setuptools tox

      - name: Run live integration tests
        if: steps.key.outputs.present == 'true'
        run: tox -e py312 -- tests/test_integration.py
        env:
          LLMCALL_API_KEY: ${{ secrets.LLMCALL_API_KEY }}
